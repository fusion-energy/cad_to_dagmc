
name: CI with model benchmark zoo

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - '*.md'
      - 'CITATION.cff'
      - 'LICENSE.txt'
      - 'readthedocs.yml'
  push:
    branches:
      - main

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y libgl1 libglx-mesa0 libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libosmesa6 libosmesa6-dev libgles2-mesa-dev libarchive-dev libpangocairo-1.0-0

      - name: Set up Miniforge
        run: |
          wget -O Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-$(uname -m).sh"
          bash Miniforge3.sh -b -p "${HOME}/miniforge"
          source "${HOME}/miniforge/etc/profile.d/conda.sh"
          conda init bash
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda

      - name: Create and activate Conda environment
        run: |
          source "${HOME}/miniforge/etc/profile.d/conda.sh"
          conda create -n ci-env python=3.11
          conda activate ci-env
          # TODO before merging go back to installing cadquery from conda-forge,
          # pinned to the same floor as pyproject.toml so that conda satisfies it
          # (otherwise pip resolves cadquery from PyPI on top of the conda
          # environment, which drags in cadquery-ocp and a second vtk, and the
          # install fails because pip cannot uninstall the conda provided vtk).
          # Until a cadquery release includes the glue option on imprint
          # (CadQuery/cadquery#2069), cadquery's conda dependencies come from
          # conda-forge and cadquery itself from git without its pip
          # dependencies, so the conda vtk is left alone.
          conda install -c conda-forge "openmc=0.15.3=dagmc*nompi*" trimesh networkx gmsh python-gmsh "ocp=8.0.1" "pyparsing>=3.0.0" "ezdxf>=1.3.0" ipython typing_extensions nlopt "multimethod>=2.1,<3.0" casadi runtype numba scipy trame trame-vtk trame-components trame-vuetify path
          python -m pip install --no-deps "cadquery @ git+https://github.com/CadQuery/cadquery"
          python -m pip install "cad-to-dagmc-mesher @ git+https://github.com/fusion-energy/cad-to-dagmc-mesher@imprint-glue-option"
          python -m pip install .[tests]
          python -m pip install git+https://github.com/svalinn/pydagmc

      - name: Run tests
        shell: bash -l {0}
        run: |
          source "${HOME}/miniforge/etc/profile.d/conda.sh"
          conda activate ci-env
          python -m ensurepip --upgrade
          python -m pip install . --no-deps
          python -m pip install openmc_data_downloader
          openmc_data_downloader -l ENDFB-7.1-NNDC -i Fe56 Be9 Al27
          export OPENMC_CROSS_SECTIONS="${GITHUB_WORKSPACE}/cross_sections.xml"
          git clone --single-branch -b main --depth 1 https://github.com/fusion-energy/model_benchmark_zoo.git
          cd model_benchmark_zoo
          python -m pip install .[tests]
          PYTHONPATH="${GITHUB_WORKSPACE}/tests" pytest -p openmc_benchmark_plugin tests/test_cad_to_dagmc -v
